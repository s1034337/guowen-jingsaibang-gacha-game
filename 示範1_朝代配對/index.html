<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古今對對碰｜朝代配對</title>
  <link rel="stylesheet" href="style.css" />
  <style>.modal[hidden]{display:none !important}</style>
</head>
<body>
  <main class="game-shell">
    <header class="hero">
      <p class="eyebrow">國中歷史 · 朝代代表事件</p>
      <h1>古今對對碰</h1>
      <p>把右側的歷史卷軸，拖到正確的朝代圖卡！</p>
    </header>

    <section class="status" aria-live="polite">
      <span id="progress">已完成 0 / 14</span><span class="divider">✦</span><span id="message">從一張卷軸開始吧！</span>
    </section>

    <section class="board" aria-label="朝代配對遊戲">
      <section class="dynasty-area" aria-label="朝代圖卡">
        <h2>朝代圖卡</h2>
        <div id="dynastyGrid" class="dynasty-grid"></div>
      </section>
      <aside class="event-area" aria-label="待配對歷史事件">
        <div class="event-heading"><h2>歷史卷軸</h2><button id="resetBtn" type="button">重新洗牌</button></div>
        <p class="hint">電腦可拖曳；手機請先點卷軸，再點朝代圖卡。</p>
        <div id="eventPile" class="event-pile"></div>
      </aside>
    </section>
  </main>

  <div id="winModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modal-card"><div class="seal large">全數過關</div><h2 id="winTitle">你完成了朝代探險！</h2><p>14 張歷史卷軸都回到正確的時代囉。</p><button id="playAgain" type="button">再玩一次</button></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
