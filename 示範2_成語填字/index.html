<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成語填字｜國中國文練習</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#34261b; --paper:#fff7df; --seal:#af3027; --jade:#527266; --gold:#c79043; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:"Noto Serif TC",serif; background:#d6c29b url("assets/images/study-background.png") center/cover fixed; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background:rgba(52,35,19,.15); }
    .game { position:relative; width:min(960px,94vw); margin:auto; padding:16px 0 36px; }
    .top { display:grid; grid-template-columns:210px 1fr auto; gap:16px; align-items:center; }
    .title { width:100%; filter:drop-shadow(0 5px 5px rgba(43,28,15,.2)); }
    .instruction { margin:0; padding:10px 14px; border-radius:12px; background:rgba(255,248,227,.88); box-shadow:0 4px 12px #3d281426; font-weight:700; text-align:center; }
    .stats { display:flex; gap:8px; }
    .stat { min-width:78px; padding:8px 10px; border:2px solid #87644088; border-radius:10px; background:#fff9e9e8; text-align:center; font-size:.84rem; font-weight:900; box-shadow:0 3px 0 #79532b33; }
    .stat b { display:block; color:var(--seal); font-size:1.35rem; }
    .paper { position:relative; overflow:hidden; margin-top:14px; padding:clamp(18px,4vw,38px); border:3px solid #8d663a88; border-radius:20px; background:linear-gradient(110deg,#fff9e9eF,#f4e2b8f2); box-shadow:0 18px 40px #33200f55, inset 0 0 45px #9d71461c; }
    .paper::before { content:""; position:absolute; inset:0; opacity:.08; pointer-events:none; background:repeating-linear-gradient(0deg,transparent 0 7px,#956635 8px 9px); }
    .asset { position:absolute; width:220px; opacity:.31; pointer-events:none; mix-blend-mode:multiply; }
    .asset.left { left:-82px; bottom:-78px; } .asset.right { right:-85px; top:-70px; transform:rotate(180deg); }
    .content { position:relative; z-index:1; }
    .idiom { display:grid; grid-template-columns:repeat(4,minmax(60px,118px)); justify-content:center; gap:clamp(9px,2vw,20px); margin:8px auto 18px; }
    .square { position:relative; display:grid; place-items:center; aspect-ratio:1; border-radius:8px; background-color:#fffdf4; font-size:clamp(2.3rem,8vw,4.5rem); font-weight:900; box-shadow:inset 0 0 0 1px #fff,0 4px 7px #64431e22; overflow:hidden; }
    .square::before,.square::after { content:""; position:absolute; background:#8d5c3840; } .square::before{ width:1px;height:100%; } .square::after{ width:100%;height:1px; }
    .fixed { border:2px solid #8d6a4588; } .blank { border:3px solid var(--seal); cursor:pointer; color:var(--seal); transition:.18s; }
    .blank:focus-visible,.card:focus-visible,.button:focus-visible { outline:4px solid #e4a33b; outline-offset:3px; }
    .blank.target { box-shadow:0 0 0 6px #d88a3960; } .blank.locked { cursor:default; animation:pop .38s ease-out; }
    .stamp { position:absolute; inset:6%; display:grid; place-items:center; border:4px double var(--seal); border-radius:50%; color:var(--seal); font-size:.62rem; font-weight:900; opacity:.82; transform:rotate(-13deg); pointer-events:none; }
    .message { min-height:48px; max-width:670px; margin:0 auto 15px; padding:10px 14px; border:2px solid #87644055; border-radius:10px; background:#fffdf0c9; text-align:center; font-weight:900; } .message.good{ color:#286746; } .message.bad{ color:var(--seal); animation:shake .3s; }
    .bank { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; max-width:680px; margin:auto; }
    .card { min-height:64px; border:2px solid #9c7045; border-radius:7px; background:linear-gradient(135deg,#fffbed,#ecd49f); color:#332419; box-shadow:3px 4px 0 #81552644; cursor:grab; font:900 clamp(1.5rem,5vw,2.2rem) "Noto Serif TC",serif; transition:transform .15s,opacity .15s; touch-action:none; }
    .card:hover{ transform:translateY(-3px) rotate(-1deg); } .card.selected{ border-color:var(--seal); outline:4px solid #d56a4433; transform:translateY(-4px); } .card.used{ opacity:.28; cursor:default; transform:none; }
    .answer { display:none; max-width:680px; margin:20px auto 0; padding:18px; border:3px solid #b8773b88; border-radius:12px; background:#fff5d9f2; text-align:center; } .answer.show{ display:block; } .answer h2{ margin:0 0 8px; color:#2c694a; } .answer p{ margin:0 0 13px; line-height:1.75; font-weight:700; }
    .button { border:0; border-radius:8px; padding:12px 22px; background:linear-gradient(#ca5547,#992b25); color:white; box-shadow:0 4px 0 #681b17; cursor:pointer; font:900 1rem "Noto Serif TC",serif; } .button:active{ transform:translateY(3px); box-shadow:0 1px 0 #681b17; }
    @keyframes pop { 0%{transform:scale(.75) rotate(-8deg)} 70%{transform:scale(1.1) rotate(2deg)} } @keyframes shake { 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
    @media(max-width:700px){ .top{grid-template-columns:130px 1fr;}.stats{grid-column:1/-1;justify-content:center}.instruction{font-size:.9rem}.bank{grid-template-columns:repeat(3,1fr)}.asset{width:160px}.paper{padding:18px 12px;} }
    @media(max-width:390px){.top{grid-template-columns:105px 1fr;gap:8px}.instruction{padding:7px;font-size:.8rem}.square{font-size:2.1rem}.idiom{gap:7px}.card{min-height:55px}}
  </style>
</head>
<body>
  <main class="game">
    <header class="top">
      <img class="title" src="assets/images/title-plaque.png" alt="成語填字" />
      <p class="instruction">拖曳字卡到米字格，或先點字卡、再點空格。</p>
      <div class="stats"><div class="stat">題次<b><span id="round">1</span> / 5</b></div><div class="stat">答對<b id="score">0</b></div></div>
    </header>
    <section class="paper" aria-live="polite">
      <img class="asset left" src="assets/images/scholar-assets.png" alt="" aria-hidden="true"><img class="asset right" src="assets/images/scholar-assets.png" alt="" aria-hidden="true">
      <div class="content">
        <div class="idiom" id="idiom" aria-label="成語填字題目"></div>
        <p id="message" class="message">請把合適的字卡放進紅色米字格。</p>
        <div id="bank" class="bank" aria-label="字卡區"></div>
        <section id="answer" class="answer"><h2 id="complete"></h2><p id="meaning"></p><button id="next" class="button" type="button">下一題</button></section>
      </div>
    </section>
  </main>
  <script>
    const questions=[
      {word:'一鳴驚人',holes:[1,3],answers:['鳴','人'],meaning:'比喻平時沒有特殊表現，一做事便有驚人的成績。'},
      {word:'自相矛盾',holes:[1,3],answers:['相','盾'],meaning:'比喻說話或做事前後抵觸，不能一致。'},
      {word:'畫龍點睛',holes:[1,3],answers:['龍','睛'],meaning:'比喻在關鍵處加上精采的一筆，使內容更加生動。'},
      {word:'刻舟求劍',holes:[1,3],answers:['舟','劍'],meaning:'比喻拘泥成法、不知變通。'},
      {word:'井底之蛙',holes:[1,3],answers:['底','蛙'],meaning:'比喻見識淺薄、眼界狹小的人。'},
      {word:'守株待兔',holes:[1,3],answers:['株','兔'],meaning:'比喻妄想不勞而獲，或死守狹隘的經驗。'},
      {word:'胸有成竹',holes:[1,3],answers:['有','竹'],meaning:'比喻做事前已有完整的計畫或把握。'},
      {word:'亡羊補牢',holes:[1,3],answers:['羊','牢'],meaning:'比喻出了問題後及時補救，還不算太晚。'},
      {word:'水落石出',holes:[1,3],answers:['落','出'],meaning:'比喻事情真相完全顯露。'},
      {word:'柳暗花明',holes:[1,3],answers:['暗','明'],meaning:'比喻在困境中出現轉機，重新看到希望。'}
    ];
    const pool=[...'天地日月山川風雨雲海春夏秋冬東西南北大小多少高低遠近快慢好壞真假美醜前後左右來去開關明白紅綠青黃黑白'];
    const $=s=>document.querySelector(s); let game=[],index=0,score=0,selected=null,drag=null;
    function shuffle(a){return a.sort(()=>Math.random()-.5)}
    function start(){game=shuffle([...questions]).slice(0,5);index=0;score=0;render()}
    function render(){selected=null; const q=game[index];$('#round').textContent=index+1;$('#score').textContent=score;$('#answer').classList.remove('show'); $('#message').className='message';$('#message').textContent='請把合適的字卡放進紅色米字格。';
      $('#idiom').innerHTML=[...q.word].map((c,i)=>{let h=q.holes.indexOf(i);return h<0?`<div class="square fixed">${c}</div>`:`<button class="square blank" data-hole="${h}" data-answer="${q.answers[h]}" aria-label="第 ${h+1} 個空格"></button>`}).join('');
      const choices=shuffle([...q.answers,...shuffle(pool.filter(x=>!q.word.includes(x))).slice(0,8)]);$('#bank').innerHTML=choices.map((c,i)=>`<button class="card" data-char="${c}" data-id="${i}" draggable="true">${c}</button>`).join('');
      document.querySelectorAll('.card').forEach(c=>{c.addEventListener('click',()=>choose(c));c.addEventListener('dragstart',e=>{drag=c;e.dataTransfer.setData('text/plain',c.dataset.char)});c.addEventListener('dragend',()=>drag=null)});
      document.querySelectorAll('.blank').forEach(b=>{b.addEventListener('click',()=>{if(selected) place(selected,b)});b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();if(drag)place(drag,b)})});
    }
    function choose(card){if(card.disabled)return; document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));selected=card;card.classList.add('selected');document.querySelectorAll('.blank:not(.locked)').forEach(b=>b.classList.add('target'));$('#message').textContent=`已選「${card.dataset.char}」，請點選要填入的空格。`}
    function place(card,blank){if(blank.classList.contains('locked'))return; document.querySelectorAll('.blank').forEach(b=>b.classList.remove('target')); if(card.dataset.char!==blank.dataset.answer){$('#message').textContent='這個字不對喔，字卡已退回，請再想一想！';$('#message').className='message bad';selected=null;document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));return}
      blank.classList.add('locked');blank.innerHTML=`<span>${card.dataset.char}</span><i class="stamp">答對</i>`;card.disabled=true;card.classList.remove('selected');card.classList.add('used');selected=null;$('#message').textContent='答對了！紅印章已蓋下。';$('#message').className='message good'; if(document.querySelectorAll('.blank.locked').length===2)done(); }
    function done(){const q=game[index];score++;$('#score').textContent=score;$('#complete').textContent=`完成！「${q.word}」`;$('#meaning').textContent=q.meaning;$('#next').textContent=index===4?'查看成績':'下一題';$('#answer').classList.add('show');}
    $('#next').addEventListener('click',()=>{index++;if(index<5)render();else result()});
    function result(){$('#idiom').innerHTML='';$('#bank').innerHTML='';$('#message').className='message good';$('#message').textContent='本次練習完成，繼續加油！';$('#complete').textContent='練習完成';$('#meaning').textContent=`你答對了 ${score} / 5 題。再玩一次，會抽到不同的五題喔！`;$('#next').textContent='重新開始';$('#next').onclick=start;$('#answer').classList.add('show')}
    start();
  </script>
</body>
</html>
