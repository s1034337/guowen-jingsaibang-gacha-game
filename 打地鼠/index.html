<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>讀文史知典故配對練習</title>
  <style>
    :root{--ink:#51331f;--paper:#fff7db;--green:#75ae57;--red:#df5a4e}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif;background:radial-gradient(circle at 13% 12%,#fff6d9 0 7%,transparent 7.2%),radial-gradient(circle at 90% 18%,#e9b15a 0 5%,transparent 5.2%),linear-gradient(#f9dda2,#d6eab4 53%,#a9d17e)}main{width:min(100%,940px);min-height:100vh;margin:auto;padding:22px 16px 32px}h1{width:fit-content;margin:0 auto 18px;font-size:clamp(1.65rem,5vw,2.75rem);letter-spacing:.04em;color:#fff7df;text-shadow:0 3px #704022;background:linear-gradient(#a96b3e,#78431f);border:4px solid #613418;border-radius:15px;padding:9px 22px;box-shadow:0 6px 0 #623419}.how{margin:0 auto 12px;max-width:760px;text-align:center;font-weight:800;color:#695039}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:760px;margin:0 auto 14px}.stat{background:#fff5d2;border:3px solid #9a6a42;border-radius:14px;padding:8px;text-align:center;box-shadow:0 4px 0 rgba(85,49,27,.22);font-weight:900}.stat b{display:block;color:#24705a;font-size:clamp(1.35rem,4vw,1.8rem)}#timer.low{color:var(--red);animation:pulse .55s infinite alternate}.question-card{max-width:850px;margin:0 auto 16px;padding:18px 22px;background:rgba(255,250,225,.93);border:4px solid #a97743;border-radius:18px;box-shadow:0 8px 0 rgba(91,53,27,.2);text-align:center}.question-label{color:#af6536;font-weight:900;font-size:.9rem;letter-spacing:.08em}#question{margin:7px 0 0;min-height:3em;display:grid;place-items:center;font-size:clamp(1.05rem,3.2vw,1.42rem);font-weight:900;line-height:1.55}.board{width:min(100%,760px);margin:auto;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.4vw,20px);border:5px solid #49783c;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.15) 25%,transparent 25% 50%,rgba(255,255,255,.15) 50% 75%,transparent 75%),#87bd61;box-shadow:inset 0 -12px #61994d,0 10px 0 rgba(65,104,45,.25)}.hole{position:relative;aspect-ratio:1/.88;padding:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.hole:focus-visible{outline:4px solid #ffe064;outline-offset:5px;border-radius:50%}.hole::after{content:"";position:absolute;left:5%;right:5%;bottom:4%;height:43%;z-index:3;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#1d100d,#56311d 50%,#9b6133 52%,#cd914e 72%,#795029 74%);box-shadow:0 5px 0 rgba(55,83,37,.28)}.mole-wrap{position:absolute;inset:0 8% 8%;z-index:2;transform:translateY(78%);opacity:0;transition:transform .25s cubic-bezier(.2,1.45,.25,1),opacity .18s}.hole.up .mole-wrap{transform:translateY(2%);opacity:1}.mole-wrap img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 1px rgba(60,30,14,.24))}.answer{position:absolute;z-index:5;left:50%;top:3%;width:126%;transform:translateX(-50%);padding:5px 7px;border:2px solid #70441f;border-radius:10px;background:#fff9e7;color:#593420;font-size:clamp(.7rem,2vw,1rem);line-height:1.25;font-weight:900;box-shadow:0 3px 0 #a8733e;pointer-events:none}.hole.hit .mole-wrap{animation:bonk .35s ease}.hole.wrong{animation:shake .32s ease}.feedback{height:35px;margin:13px 0 0;text-align:center;font-weight:900;font-size:clamp(1rem,3vw,1.3rem);color:#805132}.feedback.good{color:#24844c}.feedback.bad{color:#c6453f}.start{display:block;margin:17px auto 0;padding:12px 28px;border:0;border-radius:14px;background:linear-gradient(#ffd265,#ed8c39);box-shadow:0 5px 0 #ab552b;color:#542b17;font:900 1.12rem inherit;cursor:pointer}.start:active{transform:translateY(4px);box-shadow:0 1px 0 #ab552b}.overlay{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(46,76,43,.43);backdrop-filter:blur(4px)}.overlay.show{display:grid}.result{width:min(92vw,440px);padding:28px;text-align:center;border:5px solid #7d4a25;border-radius:24px;background:#fff4d4;box-shadow:0 12px 0 #65401f}.result h2{margin:0;font-size:2rem}.result p{font-size:1.2rem;font-weight:900;line-height:1.7}@keyframes bonk{50%{transform:translateY(18%) scale(.92) rotate(8deg)}}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}@keyframes pulse{to{transform:scale(1.12)}}@media(max-width:520px){main{padding:14px 9px 24px}.board{padding:14px 10px;gap:13px}.question-card{padding:14px 13px}.answer{width:137%;font-size:.7rem}.hud{gap:7px}.stat{padding:7px 3px}}
    .time-options{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:0 auto 14px;font-weight:900}.time-options span{color:#6c492d}.time-choice{border:2px solid #945c32;border-radius:999px;padding:7px 13px;background:#fff4d4;color:#603b22;font:900 .95rem inherit;cursor:pointer}.time-choice.active{background:#f2a548;color:#fff;border-color:#8f4d24;box-shadow:0 3px 0 #8f4d24;transform:translateY(-2px)}.result .explanation{font-size:1rem;text-align:left;background:#fffdf1;border:2px dashed #c58a4a;border-radius:12px;padding:12px;line-height:1.65}.overlay{z-index:50}.round-options{display:flex;justify-content:center;gap:10px;margin:0 auto 13px;flex-wrap:wrap}.round-button{border:3px solid #95613a;border-radius:16px;padding:9px 17px;background:#fff6df;color:#633b22;font:900 1rem inherit;cursor:pointer;box-shadow:0 3px 0 rgba(102,60,29,.3)}.round-button.active{background:#f6aa54;color:#fff;border-color:#9c582d}
    /* 新角色畫布較高，放大並上移以使小車完整探出洞口。 */
    .mole-wrap img{transform:translateY(-10%) scale(1.32)}
    .instruction{font-size:clamp(.85rem,2.5vw,1.05rem);font-weight:700}
    .teacher-signature{margin:-12px auto 9px;text-align:center;color:rgba(255,255,255,.78);font-size:.82rem;font-weight:700;letter-spacing:.16em;text-shadow:0 1px 3px rgba(86,52,112,.28)}
    body{background:#eadbff url("assets/pastel-felt-meadow.png") center/cover fixed no-repeat}
    .board{background-color:rgba(127,190,128,.9)}.question-card,.stat{background:rgba(255,250,236,.94)}.music-button{display:block;margin:-8px auto 12px;padding:7px 13px;border:2px solid #9767a9;border-radius:999px;background:#fff6fd;color:#714884;font:800 .9rem inherit;cursor:pointer}
    /* 出題後的角色與答案卡固定顯示在洞口前方，避免被洞口前緣遮住。 */
    .hole.up{outline:3px solid rgba(255,238,166,.85);outline-offset:2px;border-radius:50%}
    .hole.up .mole-wrap{z-index:6!important;overflow:visible}
    .hole.up .answer{display:block!important;visibility:visible!important;opacity:1!important}
  </style>
</head>
<body><main>
  <h1>讀文史知典故配對練習</h1><div class="teacher-signature">阿禎老師</div><button id="musicButton" class="music-button" type="button">音樂：開</button><p class="how" id="scopeText">考題範圍：第壹篇第二單元〈施政方法〉</p><section class="round-options" aria-label="選擇挑戰回次"><button class="round-button" type="button" data-round="1">第一回：帝王故事</button><button class="round-button active" type="button" data-round="2">第二回：施政方法</button><button class="round-button" type="button" data-round="3">第三回：心機手段</button><button class="round-button" type="button" data-round="4">第四回：當前局勢</button><button class="round-button" type="button" data-round="5">第五回：戰場局勢</button></section>
  <section class="hud" aria-label="遊戲狀態"><div class="stat">分數<b id="score">0</b></div><div class="stat">題數<b id="progress">0 / 10</b></div><div class="stat"><span id="timeLabel">挑戰秒數</span><b id="timer">0</b></div></section>
  <section class="question-card"><div class="question-label">題目</div><div id="question"><span class="instruction">打地鼠作答說明：看清題目後，點選有正確答案；答錯會顯示解析，並從第一題重新挑戰。</span></div></section>
  <button id="start" class="start" type="button" onclick="begin()" style="font-size:clamp(1.45rem,5vw,2rem);padding:16px 42px;letter-spacing:.08em">開始挑戰！</button>
  <section class="board" id="board" aria-label="答案天竺鼠小車九宮格"></section><div id="feedback" class="feedback" aria-live="polite"></div>
</main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="result"><h2 id="resultTitle">複習完成！</h2><p id="resultText"></p><button id="restart" class="start" type="button">再玩一次</button></div></div>
<script>
const questions=[["丹麥王子為父報仇，最終卻走向毀滅的悲劇故事。","哈姆雷特","羅密歐與茱麗葉","奧賽羅","李爾王"],["比喻公而忘私，勤於職守。","三過家門而不入","鞠躬盡瘁","廢寢忘食","克己奉公"],["指覬覦王位，謀取政權；或指謀取最高榮譽、地位。","問鼎","逐鹿中原","稱王稱霸","奪權篡位"],["比喻不了解民間疾苦，脫離現實。","何不食肉糜","紙上談兵","閉門造車","畫餅充飢"],["比喻君位。","九五之尊","南面稱孤","萬歲千秋","孤家寡人"],["比喻婦人專權。","牝雞司晨","垂簾聽政","紅顏禍水","牝雞無晨"],["周幽王為博紅顏一笑，（ ），開了玩笑，導致喪命，為後人所恥笑。","烽火戲諸侯","隻手遮天","一字千金","玩火自焚"],["班上兩個同學吵架，其他人不敢勸架，都躲在一旁（ ），還偷偷打賭誰會先哭。","作壁上觀","袖手旁觀","隔岸觀火","順水推舟"],["小明在電玩遊戲中打敗魔王，獲得傳說中的金色盔甲，感覺像是（ ）一樣，成為遊戲世界的強者。","黃袍加身","錦衣玉食","金蟬脫殼","威風凜凜"],["這位董事長雖然名義上掌權，實際上被副總控制，簡直是現代版的（ ）。","挾天子以令諸侯","傀儡政權","太上皇","寄人籬下"]].map(([question,answer,...options])=>({question,answer,options:[answer,...options]}));
const explanations=["《哈姆雷特》是莎士比亞的悲劇，主角哈姆雷特為替父親報仇，最後走向毀滅。","大禹治水時曾三次經過家門卻沒有進去，形容為公事忘私、盡忠職守。","「鼎」原是國家權力的象徵；「問鼎」後來比喻企圖奪取政權或最高地位。","晉惠帝聽聞百姓挨餓，竟問「何不食肉糜」，顯示他不了解民間疾苦。","《易經》中「九五」是君主所在的尊位，因此「九五之尊」比喻君位。","母雞在早晨啼叫是反常現象，古人用「牝雞司晨」比喻婦人專權。","周幽王為取悅褒姒而點燃烽火，戲弄諸侯，後來真的有敵軍時無人救援。","「作壁上觀」指在一旁觀看而不參與，正符合旁人躲著看同學吵架的情境。","「黃袍加身」原指趙匡胤被擁立為帝，後來比喻登上顯要地位。","漢獻帝受曹操控制；曹操以皇帝名義號令諸侯，所以稱「挾天子以令諸侯」。"];
questions.forEach((item,i)=>item.explanation=explanations[i]);
const roundOne=questions.map(item=>({...item,options:[...item.options]}));
let idiomPool=questions.map(item=>item.answer);
questions.splice(0,questions.length,
  {question:"意為煩苛酷虐的政令比老虎還凶猛可怕。",answer:"苛政猛於虎",explanation:"語出《禮記》。孔子說苛刻殘酷的政令，比老虎還要可怕。"},
  {question:"比喻事情的好壞或成敗都由同一人造成的。",answer:"成也蕭何，敗也蕭何",explanation:"韓信由蕭何推薦而受重用，也因蕭何設計而被殺，所以說成敗都由蕭何造成。"},
  {question:"比喻後人依循前人所訂的規章辦事。",answer:"蕭規曹隨",explanation:"蕭何制定制度後，曹參繼任丞相，仍照著原有規章辦理，因此比喻承襲前人的制度。"},
  {question:"比喻在上者可為非作歹，在下者卻受到種種的限制。",answer:"只許州官放火，不許百姓點燈",explanation:"州官可以放火，百姓卻連點燈都不准，用來諷刺權勢者與一般人的不平等。"},
  {question:"比喻在上位者以德化民。",answer:"風行草偃",explanation:"風一吹，草就會倒下；比喻在上位者施行德政，百姓自然受到感化。"},
  {question:"活動開始前，主辦單位和參賽者（　　），必須遵守時間、保持秩序，還有不能作弊。",answer:"約法三章",explanation:"原指劉邦與百姓約定三條法律；現在指事先約定幾項大家都要遵守的規則。"},
  {question:"老師（　　）要我們按時完成作業，但還是有同學拖到期限過了還沒寫。",answer:"三令五申",explanation:"「三令五申」指再三命令、反覆告誡，符合老師多次提醒學生的情況。"},
  {question:"社會工作者在災區，為了安置災民、協助重建生活，即使（　　），也在所不辭。",answer:"摩頂放踵",explanation:"從頭頂到腳跟都受到磨損，形容不辭勞苦、奉獻自己。"},
  {question:"暴君（　　），對百姓的生命毫不介意，濫殺無辜。",answer:"草菅人命",explanation:"把人的性命看得像野草一樣不值錢，形容任意殘害人命。"},
  {question:"城市的治安良好，（　　），市民們都相當自律。",answer:"路不拾遺",explanation:"路上有別人遺失的東西，也沒有人撿走，形容社會風氣良好。"}
);
idiomPool=questions.map(item=>item.answer);
const roundTwo=questions.map(item=>({...item}));
const roundThree=[
  {question:"本指在酒宴上解除將領的兵權。泛指輕而易舉地解除將領的兵權。",answer:"杯酒釋兵權",explanation:"宋太祖趙匡胤以酒宴勸說將領交出兵權；後來比喻輕易地解除將領兵權。"},
  {question:"比喻處理小事，毋需大才。",answer:"割雞焉用牛刀",explanation:"殺雞何必使用宰牛的大刀？比喻處理小事不需要動用大才或大力量。"},
  {question:"比喻求官或求名利的便捷途徑。",answer:"終南捷徑",explanation:"有人隱居終南山以博取名聲、求得官位；後來指追求名利的方便途徑。"},
  {question:"比喻為難、牽制。",answer:"掣肘",explanation:"拉住手肘會使人行動不便，因此「掣肘」比喻受到牽制或阻礙。"},
  {question:"不深入險境，就不能達到目標。",answer:"不入虎穴，焉得虎子",explanation:"不進入老虎的洞穴，怎能得到小老虎？比喻不冒險就無法取得成果。"},
  {question:"比喻以空想來安慰自己。",answer:"望梅止渴",explanation:"曹操用前方有梅林的說法，讓口渴的士兵想到酸梅而暫時止渴；比喻用空想安慰自己。"},
  {question:"當初遲到要請客的規定是你堅持定的，今天你無故遲到，那就（　　）吧！",answer:"請君入甕",explanation:"武則天命人用來對付周興的方法反過來對付周興；比喻用對方的方法來對付對方。"},
  {question:"公司的銷售高手有著（　　），業績總是名列全國前三。",answer:"三寸之舌",explanation:"舌頭只有三寸，卻能說服人；比喻能言善辯的口才。"},
  {question:"經理每天上班有一半的時間都在看股票，簡直（　　），讓人氣憤。",answer:"尸位素餐",explanation:"占著職位卻不做事，只白白領取俸祿；比喻占著職位不盡責任。"},
  {question:"財團壟斷市場，操控物價，企圖（　　），這種行徑毫無公平可言。",answer:"一手遮天",explanation:"一隻手想把天空遮住；比喻仗著權勢，玩弄手段，掩蓋真相或胡作非為。"}
];
const roundFour=[
  {question:"比喻懷念故國或感時傷國的悲憤心情。",answer:"新亭對泣",explanation:"晉朝士人在新亭相對哭泣，感傷國土淪陷；後來比喻懷念故國或憂國傷時。"},
  {question:"比喻任職不能長久者。",answer:"五日京兆",explanation:"京兆尹張敞任期將滿五日，仍整飭屬下；後來比喻任職時間短暫，不能久任。"},
  {question:"比喻陰謀敗露，將被懲治。",answer:"東窗事發",explanation:"傳說秦檜與妻子在東窗下密謀害岳飛，後來陰謀敗露；比喻壞事或陰謀被揭發。"},
  {question:"比喻為不存在的事情枉自驚恐。",answer:"杯弓蛇影",explanation:"有人把杯中弓的倒影誤認為蛇而生病；比喻因疑神疑鬼而自我驚嚇。"},
  {question:"比喻緊張、恐懼，疑神疑鬼。",answer:"草木皆兵",explanation:"苻堅在淝水之戰前，將山上的草木都看成敵兵；形容人極度緊張恐懼。"},
  {question:"比喻所處環境艱難困頓，危急無援。",answer:"四面楚歌",explanation:"項羽被漢軍包圍，夜裡聽到四面傳來楚歌；比喻陷入孤立無援的困境。"},
  {question:"在電玩遊戲裡我的血量快見底了，簡直是（　　），隨時可能被秒殺。",answer:"窮途末路",explanation:"走到窮盡的道路與末端，沒有出路；比喻陷入絕境。"},
  {question:"辯論比賽上，兩所學校實力（　　），誰也不讓誰，一時之間難分勝負。",answer:"旗鼓相當",explanation:"兩軍旗幟與戰鼓聲勢相同；比喻雙方實力不相上下。"},
  {question:"小偷被當場抓住，嚇得（　　），不敢辯解一句。",answer:"噤若寒蟬",explanation:"像深秋的寒蟬一樣不出聲；形容因害怕而不敢說話。"},
  {question:"幸好有醫生的妙手回春，病人（　　），恢復健康。",answer:"化險為夷",explanation:"把危險轉變為平安；比喻轉危為安。"}
];
const roundFive=[
  {question:"比喻英勇作戰，效命沙場，以戰死為榮。",answer:"馬革裹屍",explanation:"東漢馬援說，大丈夫應當戰死沙場，用馬皮包裹屍體下葬；比喻英勇作戰，為國捐軀。"},
  {question:"比喻做事果決、義無反顧，自斷後路。",answer:"破釜沉舟",explanation:"項羽渡河後打破鍋子、鑿沉船隻，表示不留退路；比喻下定決心，義無反顧。"},
  {question:"比喻軍隊人數眾多，兵力強大。",answer:"投鞭斷流",explanation:"傳說前秦苻堅說把士兵的馬鞭投入江中，就能使江水斷流；形容兵力極為強大。"},
  {question:"比喻虛張聲勢，阻嚇敵人。",answer:"空城計",explanation:"諸葛亮大開城門、在城樓彈琴，使敵軍猜疑而退兵；比喻故意示弱或虛張聲勢來迷惑對方。"},
