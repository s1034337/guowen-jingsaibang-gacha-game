<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>各行各業典故貪食蛇</title>
  <style>
    :root{--ink:#443427;--cream:#fff9e9;--tea:#32715b;--orange:#e98645;--purple:#8061a8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4e6c6;color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif}main{width:min(100%,980px);min-height:100vh;margin:auto;padding:20px 14px 34px;background:linear-gradient(rgba(255,251,240,.87),rgba(255,251,240,.9)),url("assets/profession-street.png") center top/cover fixed}.hero{text-align:center}.hero h1{display:inline-block;margin:0;padding:10px 24px;border:4px solid #6f4b31;border-radius:18px;background:linear-gradient(#ab754d,#7c4d2d);box-shadow:0 6px #5e3a27;color:#fff7df;font-size:clamp(1.65rem,5vw,2.7rem);letter-spacing:.05em;text-shadow:0 2px #6a432c}.teacher{margin:9px 0 0;color:#fff;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-shadow:0 1px 2px #6b4a33}.scope{margin:12px auto 16px;font-weight:900;color:#5b493b}.intro,.game{width:min(100%,860px);margin:auto;border:4px solid #a57046;border-radius:24px;background:rgba(255,250,235,.93);box-shadow:0 8px 0 rgba(105,75,47,.19);padding:20px}.intro{text-align:center}.intro h2{margin:0 0 8px;color:#7a4c2d}.intro p{max-width:610px;margin:9px auto;line-height:1.7;font-weight:700}.start,.again{border:0;border-radius:15px;padding:13px 27px;background:linear-gradient(#ffd56c,#ea9140);box-shadow:0 5px #aa582f;color:#562d1c;font:900 1.13rem inherit;cursor:pointer}.start:active,.again:active{transform:translateY(4px);box-shadow:0 1px #aa582f}.game[hidden],.intro[hidden],.question-box[hidden]{display:none}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{padding:8px;border:3px solid #aa784d;border-radius:13px;background:#fff7df;text-align:center;font-weight:900}.stat b{display:block;color:var(--tea);font-size:clamp(1.25rem,4vw,1.65rem)}.play-area{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}.canvas-wrap{position:relative;margin:auto;width:min(100%,500px);border:6px solid #5d8a52;border-radius:24px;overflow:hidden;background:#d9f0ba;box-shadow:inset 0 0 0 5px #effbdc,0 7px 0 rgba(54,90,46,.22)}canvas{display:block;width:100%;aspect-ratio:1;background:linear-gradient(135deg,#d9efb7,#b7df98)}.guide{padding:13px;border:3px dashed #b98250;border-radius:18px;background:#fffdf3;line-height:1.65;font-weight:700}.guide h3{margin:0 0 5px;color:#9a5a33}.controls{display:grid;grid-template-columns:repeat(3,52px);justify-content:center;gap:6px;margin-top:14px}.controls button{height:46px;border:2px solid #96613d;border-radius:11px;background:#fff8e7;color:#633c26;font:900 1.1rem inherit;cursor:pointer}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(4){grid-column:2}.question-box{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:18px;background:rgba(48,70,47,.48);backdrop-filter:blur(4px)}.modal{width:min(94vw,560px);max-height:90vh;overflow:auto;padding:24px;border:5px solid #7a4d2d;border-radius:24px;background:#fff7df;box-shadow:0 12px #60402b;text-align:center}.modal h2{margin:0 0 8px;font-size:clamp(1.35rem,4vw,1.75rem);color:#8f4f2c}.clue{margin:10px 0 16px;padding:13px;border-radius:14px;background:#fffdf3;border:2px dashed #c68f55;line-height:1.6;font-weight:900}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:48px;border:3px solid #93603c;border-radius:13px;background:#fffef7;color:#503523;font:900 1rem inherit;cursor:pointer}.choice:hover{background:#ffe2a2}.explain{margin:12px 0;padding:12px;border-radius:12px;background:#fffdf3;text-align:left;line-height:1.65;font-weight:700}.notice{min-height:1.5em;margin:10px 0;color:#a13d34;font-weight:900}@media(max-width:700px){main{padding:12px 8px 25px}.intro,.game{padding:14px}.play-area{grid-template-columns:1fr}.guide{order:-1}.status{gap:6px}.stat{padding:6px 3px}.choices{grid-template-columns:1fr}.hero h1{padding:8px 14px}.teacher{color:#75513a;text-shadow:none}}
  </style>
</head>
<body>
  <main>
    <header class="hero"><h1>各行各業典故貪食蛇</h1><div class="teacher">阿禎老師</div><p class="scope">考題範圍：第貳篇第一單元〈各行各業〉</p></header>
    <section id="intro" class="intro"><h2>吃典故，答配對！</h2><p>操控小蛇吃到「典」字球後，會出現一張解釋或例句卡。選出正確典故才可以繼續前進；答錯會看到解析，並從第一題重新挑戰。</p><button id="start" class="start" type="button">開始挑戰！</button></section>
    <section id="game" class="game" hidden><div class="status"><div class="stat">已答對<b id="score">0 / 10</b></div><div class="stat">目前題目<b id="progress">1 / 10</b></div><div class="stat">挑戰秒數<b id="timer">0</b></div></div><div class="play-area"><div><div class="canvas-wrap"><canvas id="board" width="560" height="560" aria-label="典故貪食蛇遊戲區"></canvas></div><div class="controls" aria-label="方向控制"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div></div><aside class="guide"><h3>玩法</h3>使用鍵盤方向鍵，或下方按鈕控制小蛇。<br>吃到「典」字球後，選出正確典故。<br>不可撞到牆壁或自己的身體。</aside></div></section>
  </main>
  <section id="questionBox" class="question-box" hidden><div class="modal"><h2 id="modalTitle">典故配對</h2><div id="clue" class="clue"></div><div id="choices" class="choices"></div><p id="notice" class="notice"></p><div id="explain" class="explain" hidden></div><button id="action" class="again" type="button" hidden>繼續前進</button></div></section>
  <script>
    const pairs=[
      {clue:"比喻自請從軍或主動請求擔當重任。",answer:"請纓",explain:"漢武帝時，終軍自請持長纓繫住南越王，因此「請纓」比喻自請從軍或主動擔當重任。"},
      {clue:"指主管男女婚姻的神仙，後指媒人。",answer:"月下老人",explain:"傳說月下老人掌管婚姻，後來用來指媒人。"},
      {clue:"指登場演戲或假扮古人、模仿他人。",answer:"優孟衣冠",explain:"優孟穿著已故宰相孫叔敖的衣冠模仿他；後來指登場演戲或模仿他人。"},
      {clue:"竊賊的雅稱。",answer:"梁上君子",explain:"陳寔發現小偷躲在梁上，稱他為「梁上君子」；後來成為竊賊的雅稱。"},
      {clue:"代稱軍中戰友。",answer:"袍澤",explain:"古人同袍共澤，後以「袍澤」代稱軍中同袍或戰友。"},
      {clue:"他的評論鞭辟入裡，不僅言辭犀利，更是深諳（　　）的要義，令人讚嘆不已。",answer:"春秋筆法",explain:"孔子作《春秋》用字簡約而褒貶分明；「春秋筆法」指寓褒貶於曲折文字的寫法。"},
      {clue:"（　　）為了傳承國粹，日復一日苦練唱作及身段。",answer:"梨園子弟",explain:"唐玄宗在梨園教習歌舞，後以「梨園子弟」代稱戲曲演員。"},
      {clue:"為了抵抗外侮，許多校園青年紛紛（　　），走上戰場。",answer:"投筆從戎",explain:"班超投下寫字的筆，投身軍旅；比喻棄文從軍。"},
      {clue:"在商場上，他志在（　　），滿心想成為全國首富。",answer:"業紹陶朱",explain:"陶朱公范蠡善於經商致富；「業紹陶朱」指繼承陶朱公的事業，常用以祝商人富裕。"},
      {clue:"這一帶正是龍蛇雜處的聚落，（　　），無所不有。",answer:"三教九流",explain:"三教指儒、釋、道，九流指各家學派；後泛指各行各業、各種人物。"}
    ];
    const $=s=>document.querySelector(s),canvas=$("#board"),ctx=canvas.getContext("2d"),intro=$("#intro"),game=$("#game"),box=$("#questionBox"),scoreEl=$("#score"),progressEl=$("#progress"),timerEl=$("#timer"),clueEl=$("#clue"),choicesEl=$("#choices"),notice=$("#notice"),explainEl=$("#explain"),action=$("#action"),modalTitle=$("#modalTitle");
    const grid=14,cell=canvas.width/grid;let snake=[],dir={x:1,y:0},nextDir={x:1,y:0},food={x:9,y:7},deck=[],index=0,score=0,time=0,timer=null,loop=null,running=false,waiting=false;
    const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
    function resetSnake(){snake=[{x:4,y:7},{x:3,y:7},{x:2,y:7}];dir={x:1,y:0};nextDir={x:1,y:0};spawnFood();draw()}
    function spawnFood(){let p;do{p={x:Math.floor(Math.random()*grid),y:Math.floor(Math.random()*grid)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p}
    function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(let y=0;y<grid;y++)for(let x=0;x<grid;x++){ctx.fillStyle=(x+y)%2?"#c7eaa3":"#d9f2b9";ctx.fillRect(x*cell,y*cell,cell,cell)}ctx.fillStyle="#ef9a45";ctx.beginPath();ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.33,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff8da";ctx.font=`900 ${cell*.46}px Microsoft JhengHei`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("典",(food.x+.5)*cell,(food.y+.53)*cell);snake.forEach((part,i)=>{ctx.fillStyle=i===0?"#357c5c":"#65a96c";ctx.beginPath();ctx.roundRect(part.x*cell+3,part.y*cell+3,cell-6,cell-6,9);ctx.fill();if(i===0){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc((part.x+.33)*cell,(part.y+.34)*cell,3,0,Math.PI*2);ctx.arc((part.x+.67)*cell,(part.y+.34)*cell,3,0,Math.PI*2);ctx.fill()}})}
    function step(){if(!running||waiting)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=grid||head.y>=grid||snake.some(s=>s.x===head.x&&s.y===head.y)){restart("小蛇撞到了，從第一題再來！");return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){waiting=true;draw();ask()}else snake.pop();draw()}
    function ask(){const q=deck[index];modalTitle.textContent="吃到典故球！請完成配對";clueEl.textContent=q.clue;notice.textContent="";explainEl.hidden=true;action.hidden=true;choicesEl.innerHTML="";const options=shuffle([q.answer,...shuffle(pairs.map(p=>p.answer).filter(a=>a!==q.answer)).slice(0,3)]);options.forEach(option=>{const b=document.createElement("button");b.className="choice";b.textContent=option;b.onclick=()=>answer(option);choicesEl.append(b)});box.hidden=false}
    function answer(option){const q=deck[index];if(option===q.answer){score++;index++;scoreEl.textContent=`${score} / 10`;progressEl.textContent=index===10?"完成！":`${index+1} / 10`;notice.style.color="#27734e";notice.textContent="答對了！";explainEl.hidden=false;explainEl.textContent="解析："+q.explain;choicesEl.querySelectorAll("button").forEach(b=>b.disabled=true);action.hidden=false;action.textContent=index===10?"查看完成成績":"繼續前進";action.onclick=()=>{box.hidden=true;if(index===10){finish()}else{waiting=false;spawnFood();draw()}}}else{notice.style.color="#a13d34";notice.textContent="答錯了，請看解析後重新開始。";explainEl.hidden=false;explainEl.textContent=`正確答案：${q.answer}。${q.explain}`;choicesEl.querySelectorAll("button").forEach(b=>b.disabled=true);action.hidden=false;action.textContent="重新挑戰";action.onclick=()=>{box.hidden=true;restart()}}}
    function begin(){deck=shuffle(pairs);index=0;score=0;time=0;scoreEl.textContent="0 / 10";progressEl.textContent="1 / 10";timerEl.textContent="0";intro.hidden=true;game.hidden=false;running=true;waiting=false;clearInterval(loop);clearInterval(timer);timer=setInterval(()=>{time++;timerEl.textContent=time},1000);loop=setInterval(step,240);resetSnake()}
    function restart(message=""){clearInterval(loop);clearInterval(timer);running=false;waiting=false;if(message){modalTitle.textContent="再試一次！";clueEl.textContent=message;choicesEl.innerHTML="";notice.textContent="";explainEl.hidden=true;action.hidden=false;action.textContent="回到開始畫面";action.onclick=()=>{box.hidden=true;game.hidden=true;intro.hidden=false;draw()};box.hidden=false}else begin()}
    function finish(){clearInterval(loop);clearInterval(timer);running=false;modalTitle.textContent="恭喜全對！";clueEl.textContent=`你完成了第貳篇第一單元〈各行各業〉。`;notice.style.color="#27734e";notice.textContent=`完成總秒數：${time} 秒`;explainEl.hidden=true;choicesEl.innerHTML="";action.hidden=false;action.textContent="回到開始畫面";action.onclick=()=>{box.hidden=true;game.hidden=true;intro.hidden=false;draw()};box.hidden=false}
    function changeDirection(name){const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}},d=dirs[name];if(d.x!==-dir.x||d.y!==-dir.y)nextDir=d}
    document.addEventListener("keydown",e=>{const names={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(names[e.key]){e.preventDefault();changeDirection(names[e.key])}});document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>changeDirection(b.dataset.dir));$("#start").onclick=begin;resetSnake();
  </script>
</body>
</html>
